<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uso de AWS</title>
</head>
<body>

  <style>
    :root {
      --primary-color: #ff9900;
      --primary-hover: #ec8b00;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #232f3e;
      --text-muted: #545b64;
      --border-color: #d5dbdb;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 24px;
      text-align: center;
    }

    form {
      background-color: var(--card-bg);
      padding: 32px;
      border-radius: var(--radius);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      border: 1px solid rgba(0, 0, 0, 0.04);
      margin-bottom: 16px;
    }

    label {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: -12px;
    }

    input[type="file"] {
      font-size: 0.9rem;
      color: var(--text-muted);
      padding: 12px;
      background-color: #fafbfc;
      border: 2px dashed var(--border-color);
      border-radius: var(--radius);
      width: 100%;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    input[type="file"]:hover {
      border-color: var(--primary-color);
      background-color: #fffaf0;
    }

    input[type="file"]:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(255, 153, 0, 0.15);
    }

    input[type="file"]::file-selector-button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 8px 14px;
      margin-right: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    input[type="file"]::file-selector-button:hover {
      background-color: var(--primary-hover);
    }

    button[type="submit"] {
      background-color: var(--primary-color);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      padding: 12px 20px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(255, 153, 0, 0.3);
      width: 100%;
    }

    /* Estilo base para los enlaces-botón inferiores */
    .btn-link {
      color: white;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 12px 16px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      flex: 1;
      white-space: nowrap;
    }

    /* Botón Ver listado (Azul AWS) */
    .btn-list {
      background-color: #0972d3;
      box-shadow: 0 4px 12px rgba(9, 114, 211, 0.3);
    }
    .btn-list:hover {
      background-color: #035cb5;
    }

    /* Botón Lambda (Azul oscuro / Navy) */
    .btn-lambda {
      background-color: var(--text-main);
      box-shadow: 0 4px 12px rgba(35, 47, 62, 0.3);
    }
    .btn-lambda:hover {
      background-color: #1b2430;
    }

    button[type="submit"]:hover {
      background-color: var(--primary-hover);
    }

    button[type="submit"]:active, .btn-link:active {
      transform: scale(0.98);
    }

    .nav-buttons {
      width: 100%;
      max-width: 420px;
      display: flex;
      gap: 12px;
    }
  </style>

  <h1>Subir archivo AWS S3</h1>

  <form id="uploadForm" enctype="multipart/form-data">
    <label for="archivo">Seleccione archivo:</label>
    <input type="file" name="archivo" id="archivo" required>
    <button type="submit">Subir archivo</button>
  </form>

  <div class="nav-buttons">
    <a href="lista.html" class="btn-link btn-list">Ver listado</a>
    <a href="lambda.html" class="btn-link btn-lambda">Funciones LAMBDA</a>
  </div>

  <script>
    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const formData = new FormData(this);
      const submitBtn = this.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.innerText = "Subiendo archivo...";

      try {
        const response = await fetch('/upload', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          alert("¡Archivo subido y procesado con éxito!");
          
          this.reset(); 

          window.location.href = "/"; 
        } else {
          alert("Error: " + data.message);
          submitBtn.disabled = false;
          submitBtn.innerText = "Subir archivo";
        }
      } catch (error) {
        console.error("Error en la subida:", error);
        alert("Ocurrió un error al subir el archivo.");
        submitBtn.disabled = false;
        submitBtn.innerText = "Subir archivo";
      }
    });
  </script>

</body>
</html>
